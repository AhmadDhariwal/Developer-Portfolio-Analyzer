    <!-- API requests default to this origin (development uses proxy.conf.json).
       A deployment can inject __DEVINSIGHT_API_ORIGIN__ before the app boots. -->
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('devinsight_theme') || 'light';
          var resolved = preference;
          if (preference === 'system') {
            resolved =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
