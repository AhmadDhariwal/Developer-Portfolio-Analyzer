<div class="panel-card">
  <div class="panel-header">
    <div class="panel-title-wrapper">
      <h2>
        <span class="material-symbols-outlined" style="color: #6366f1">send</span>
        Submit a Support Request
      </h2>
      <p>Provide details about your issue or feedback.</p>
    </div>
  </div>

  <div class="prof-error" *ngIf="error">{{ error }}</div>
  <div class="prof-success" *ngIf="success">{{ success }}</div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label for="category">Category <span class="required">*</span></label>
        <select id="category" name="category" [(ngModel)]="model.category">
          <option *ngFor="let cat of categoryCards" [value]="cat.value">{{ cat.title }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="priority">Priority <span class="required">*</span></label>
        <select id="priority" name="priority" [(ngModel)]="model.priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="subject">Subject <span class="required">*</span></label>
      <input
        id="subject"
        name="subject"
        type="text"
        [(ngModel)]="model.subject"
        placeholder="Short summary of your issue or feedback"
        maxlength="150"
        required
      />
      <div class="char-counter">{{ model.subject.length }}/150</div>
    </div>

    <div class="form-group">
      <label for="message">Message <span class="required">*</span></label>
      <textarea
        id="message"
        name="message"
        [(ngModel)]="model.message"
        placeholder="Please describe your issue or feedback in detail..."
        maxlength="5000"
        required
      ></textarea>
      <div class="char-counter">{{ model.message.length }}/5000</div>
    </div>

    <div class="form-group">
      <label for="replyToEmail">Reply-to email (optional)</label>
      <input
        id="replyToEmail"
        name="replyToEmail"
        type="email"
        maxlength="254"
        [(ngModel)]="model.replyToEmail"
        (ngModelChange)="onReplyToChange()"
        placeholder="name@example.com"
      />
      <div class="field-hint">
        We use your account email by default; add another address only if you want replies
        elsewhere.
      </div>
      <div class="field-error" *ngIf="replyToInvalid">Please enter a valid email address.</div>
    </div>

    <button type="submit" class="btn-primary" [disabled]="submitting">
      <span class="material-symbols-outlined" *ngIf="!submitting">rocket_launch</span>
      <span *ngIf="!submitting">Submit Request</span>

      <span
        class="material-symbols-outlined"
        *ngIf="submitting"
        style="animation: spin 1s linear infinite"
        >progress_activity</span
      >
      <span *ngIf="submitting">Submitting...</span>
    </button>
  </form>
</div>
