<div class="conversation">
  <strong class="conversation-title">Conversation</strong>

  <div class="conversation-empty" *ngIf="!replies || replies.length === 0">
    No replies yet. Add a message below to continue the conversation.
  </div>

  <div class="reply-thread" *ngIf="replies && replies.length > 0">
    <div
      class="reply-item"
      *ngFor="let reply of replies"
      [ngClass]="reply.authorRole === 'admin' ? 'reply-admin' : 'reply-user'"
    >
      <div class="reply-head">
        <span class="reply-author">{{
          reply.authorRole === 'admin' ? 'Support Team' : 'You'
        }}</span>
        <span class="reply-time" *ngIf="reply.createdAt">{{
          reply.createdAt | date: 'medium'
        }}</span>
      </div>
      <p class="reply-body">{{ reply.body }}</p>
    </div>
  </div>

  <form class="reply-form" (ngSubmit)="onSubmit()">
    <label for="replyBody" class="reply-label">Add a reply</label>
    <textarea
      id="replyBody"
      name="replyBody"
      [(ngModel)]="replyBody"
      maxlength="5000"
      placeholder="Type your reply..."
      [disabled]="posting"
    ></textarea>
    <button type="submit" class="btn-reply" [disabled]="posting || !replyBody.trim()">
      <span class="material-symbols-outlined">send</span>
      {{ posting ? 'Sending...' : 'Send Reply' }}
    </button>
  </form>
</div>
