<main class="page-container" style="max-width: 1200px; margin: 0 auto; padding: 24px">
  <app-support-page-header></app-support-page-header>

  <!-- Category Cards -->
  <div class="category-grid">
    <div
      class="category-card"
      *ngFor="let cat of categoryCards"
      [class.active]="draft.category === cat.value"
      (click)="selectCategory(cat.value)"
    >
      <div class="card-icon" [ngClass]="cat.iconClass">
        <span class="material-symbols-outlined">{{ cat.icon }}</span>
      </div>
      <div class="card-title">{{ cat.title }}</div>
      <div class="card-desc">{{ cat.description }}</div>
      <button type="button" class="card-action">
        {{ cat.title === 'General Feedback' ? 'Send Feedback' : cat.title }}
      </button>
    </div>
  </div>

  <!-- Main Grid: Form and Tickets -->
  <div class="main-grid">
    <app-support-ticket-form
      [submitting]="isSubmittingTicket"
      [error]="supportError"
      [success]="supportSuccess"
      [draft]="draft"
      [categoryCards]="categoryCards"
      (submitTicket)="submitSupportTicket($event)"
    ></app-support-ticket-form>

    <app-support-ticket-list
      [tickets]="supportTickets"
      [loading]="isLoadingTickets"
      [page]="supportPage"
      [totalPages]="supportTotalPages"
      (open)="openTicketDetails($event)"
      (pageChange)="loadSupportTickets($event)"
    ></app-support-ticket-list>
  </div>

  <!-- FAQ Section -->
  <app-support-faq [faqs]="faqs"></app-support-faq>

  <div class="footer-note">
    We usually respond within 24-48 hours.<br />
    Need immediate help? Contact us at
    <a href="mailto:support@devinsight.com">support@devinsight.com</a>
  </div>

  <!-- Ticket Detail Modal -->
  <app-support-ticket-details
    *ngIf="selectedTicket"
    [ticket]="selectedTicket"
    [deleting]="isDeletingTicket"
    [replyPosting]="isPostingReply"
    (close)="closeTicketDetails()"
    (delete)="deleteTicket($event)"
    (reply)="submitReply($event)"
  ></app-support-ticket-details>

  <!-- Shared Confirmation Dialog Component -->
  <app-confirm-dialog
    [open]="confirmOpen"
    [title]="confirmTitle"
    [message]="confirmMessage"
    confirmText="Confirm"
    cancelText="Cancel"
    (confirmed)="onConfirmAccepted()"
    (cancelled)="onConfirmCancelled()"
  >
  </app-confirm-dialog>
</main>
