<div class="integrations-page">
  <!-- ── Cockpit Header ─────────────────────────────────────────────────────── -->
  <header
    appIntegrationsPageHeader
    class="page-head"
    [searchQuery]="searchQuery"
    (searchQueryChange)="searchQuery = $event"
    [syncAllLoading]="syncAllLoading"
    [busyProvider]="busyProvider"
    [connectedCount]="connectedCount"
    (syncAll)="syncAll()"
  ></header>

  <!-- ── Error banner ─────────────────────────────────────────────────────── -->
  <div class="error-banner" *ngIf="errorMessage">
    <div class="error-icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
    </div>
    <span class="error-text">{{ errorMessage }}</span>
    <button
      type="button"
      class="error-close"
      (click)="errorMessage = ''"
      aria-label="Dismiss error"
    >
      ×
    </button>
  </div>

  <!-- ── Telemetry Overview Strip (4 responsive cards) ───────────────────────── -->
  <section
    appIntegrationTelemetry
    class="telemetry-strip"
    aria-label="System Telemetry Overview"
    [integrations]="integrations"
    [integrationScore]="integrationScore"
    [connectedCount]="connectedCount"
    [disconnectedCount]="disconnectedCount"
    [oauthCount]="oauthCount"
    [manualCount]="manualCount"
    [isTerminalOpen]="isTerminalOpen"
    (toggleTerminal)="toggleTerminal()"
  ></section>

  <!-- ── Collapsible Terminal Feed Drawer ─────────────────────────────────── -->
  <section
    appIngestionActivityTerminal
    class="terminal-drawer"
    *ngIf="isTerminalOpen"
    [terminalLogs]="terminalLogs"
    (closeTerminal)="isTerminalOpen = false"
  ></section>

  <!-- ── Category Filter Tabs ──────────────────────────────────────────────── -->
  <nav
    appIntegrationCategoryFilters
    class="filter-bar"
    aria-label="Integration categories"
    [integrations]="integrations"
    [activeCategory]="activeCategory"
    [connectedCount]="connectedCount"
    [displayedCount]="displayedIntegrations.length"
    (activeCategoryChange)="activeCategory = $event"
  ></nav>

  <!-- ── Loading Placeholder ──────────────────────────────────────────────── -->
  <div class="loading-state" *ngIf="isLoading && integrations.length === 0">
    <div class="loading-spinner"></div>
    <span>Establishing node connections and synchronizing adapters…</span>
  </div>

  <!-- ── Main Responsive Integrations Grid ─────────────────────────────────── -->
  <div class="market-grid" *ngIf="displayedIntegrations.length > 0">
    <article
      appIntegrationProviderCard
      class="integration-card"
      *ngFor="let item of displayedIntegrations"
      [class.integration-card--connected]="item.status === 'connected'"
      [class.integration-card--busy]="busyProvider === item.provider"
      [item]="item"
      [busyProvider]="busyProvider"
      [busyAction]="busyAction"
      [unavailable]="isProviderUnavailable(item.provider)"
      [icon]="providerIconHtml[item.provider]"
      [color]="providerColor[item.provider]"
      [username]="manualUsername[item.provider]"
      (usernameChange)="manualUsername[item.provider] = $event"
      (connect)="connect($event)"
      (sync)="runIngestion($event)"
      (disconnect)="disconnect($event)"
    ></article>
  </div>

  <!-- ── Empty Search / Filter State ───────────────────────────────────────── -->
  <div class="empty-state" *ngIf="displayedIntegrations.length === 0 && !isLoading">
    <div class="empty-icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
        <line x1="8" y1="11" x2="14" y2="11" />
      </svg>
    </div>
    <h3>No matching platform integrations</h3>
    <p>No platforms found matching your query "{{ searchQuery }}" in this category.</p>
    <button
      type="button"
      class="btn btn-secondary"
      (click)="searchQuery = ''; activeCategory = 'all'"
    >
      Reset Filters
    </button>
  </div>
</div>
