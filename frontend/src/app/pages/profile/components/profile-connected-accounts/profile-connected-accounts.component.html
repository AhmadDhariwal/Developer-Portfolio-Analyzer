<div class="section-head">
  <div class="section-head__icon section-head__icon--blue">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
    </svg>
  </div>
  <div class="section-head__text">
    <h2>Connected Accounts</h2>
    <p>Link your developer repositories and professional profiles for deep code analysis</p>
  </div>
</div>

<div class="form-grid">
  <!-- GitHub Username with Prefix -->
  <div class="form-field form-field--span-2">
    <label for="profile-github-username">GitHub Profile <span class="required-star">*</span></label>
    <div class="input-prefix">
      <span class="prefix-addon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61
                           c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77
                           5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0
                           C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77
                           a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7
                           A3.37 3.37 0 0 0 9 18.13V22"
          />
        </svg>
        <span class="prefix-text">github.com/</span>
      </span>
      <input
        id="profile-github-username"
        type="text"
        [(ngModel)]="profile.githubUsername"
        placeholder="alexdev"
        title="GitHub username"
      />
    </div>
    <div class="active-context-tag" *ngIf="profile.activeGithubUsername || profile.githubUsername">
      <span class="tag-label">Active Context:</span>
      <span class="tag-val">&#64;{{ profile.activeGithubUsername || profile.githubUsername }}</span>
    </div>
  </div>

  <!-- Active Resume Banner -->
  <div class="form-field form-field--span-2" *ngIf="profile.activeResume">
    <div class="resume-context-banner">
      <div class="resume-context-info">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg>
        <div class="resume-context-texts">
          <span class="resume-context-title">Active Resume Evidence:</span>
          <span class="resume-context-file">{{ profile.activeResume.fileName }}</span>
        </div>
      </div>
      <a
        routerLink="/app/resume-analyzer"
        class="resume-analyzer-link"
        title="Open Resume Analyzer"
      >
        <span>Manage in Analyzer</span>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <polyline points="15 3 21 3 21 9" />
          <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
      </a>
    </div>
  </div>

  <!-- Personal Website -->
  <div class="form-field">
    <label for="profile-website">Personal Website</label>
    <div class="input-prefix">
      <span class="prefix-addon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="2" y1="12" x2="22" y2="12" />
          <path
            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
          />
        </svg>
        <span class="prefix-text">https://</span>
      </span>
      <input
        id="profile-website"
        type="text"
        [(ngModel)]="profile.website"
        placeholder="alexjohnson.dev"
        title="Personal website URL"
      />
    </div>
  </div>

  <!-- Twitter / X -->
  <div class="form-field">
    <label for="profile-twitter">Twitter / X</label>
    <div class="input-prefix">
      <span class="prefix-addon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"
          />
        </svg>
        <span class="prefix-text">&#64;</span>
      </span>
      <input
        id="profile-twitter"
        type="text"
        [(ngModel)]="profile.twitter"
        placeholder="alexdevjs"
        title="Twitter handle"
      />
    </div>
  </div>

  <!-- LinkedIn -->
  <div class="form-field form-field--span-2">
    <label for="profile-linkedin">LinkedIn Profile</label>
    <div class="input-prefix">
      <span class="prefix-addon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
          />
          <rect x="2" y="9" width="4" height="12" />
          <circle cx="4" cy="4" r="2" />
        </svg>
        <span class="prefix-text">linkedin.com/</span>
      </span>
      <input
        id="profile-linkedin"
        type="text"
        [(ngModel)]="profile.linkedin"
        placeholder="in/alexjohnson"
        title="LinkedIn username or path"
      />
    </div>
  </div>
</div>
