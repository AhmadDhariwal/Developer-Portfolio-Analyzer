<div class="section-head">
  <div class="section-head__icon section-head__icon--red">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
    </svg>
  </div>
  <div class="section-head__text">
    <h2>Security Settings</h2>
    <p>Manage authentication credentials, password policy, and account lifecycle</p>
  </div>
</div>

<!-- Change password expandable row -->
<button
  type="button"
  class="security-row"
  (click)="toggleChangePassword()"
  title="Change password"
  [attr.aria-expanded]="isChangingPwd"
>
  <div class="security-row__left">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </svg>
    <span class="security-row__label">Change Password</span>
  </div>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="15"
    height="15"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    class="security-chevron"
    [class.security-chevron--open]="isChangingPwd"
    aria-hidden="true"
  >
    <polyline points="9 18 15 12 9 6" />
  </svg>
</button>

<!-- Password form (expandable) -->
<div class="pwd-success" *ngIf="pwdSuccess" role="status">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="14"
    height="14"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    aria-hidden="true"
  >
    <polyline points="20 6 9 17 4 12" />
  </svg>
  <span>{{ pwdSuccess }}</span>
</div>

<div class="pwd-form" *ngIf="isChangingPwd">
  <div class="pwd-error" role="alert" *ngIf="pwdError">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="12" y1="16" x2="12.01" y2="16" />
    </svg>
    <span>{{ pwdError }}</span>
  </div>

  <div class="form-field">
    <label for="profile-current-password"
      >Current Password <span class="required-star">*</span></label
    >
    <input
      id="profile-current-password"
      type="password"
      [(ngModel)]="passwordForm.currentPassword"
      placeholder="••••••••"
      title="Current password"
      autocomplete="current-password"
    />
  </div>

  <div class="form-grid">
    <div class="form-field">
      <label for="profile-new-password">New Password <span class="required-star">*</span></label>
      <input
        id="profile-new-password"
        type="password"
        [(ngModel)]="passwordForm.newPassword"
        placeholder="••••••••"
        title="New password (minimum 6 characters)"
        autocomplete="new-password"
      />
    </div>
    <div class="form-field">
      <label for="profile-confirm-password"
        >Confirm New Password <span class="required-star">*</span></label
      >
      <input
        id="profile-confirm-password"
        type="password"
        [(ngModel)]="passwordForm.confirmPassword"
        placeholder="••••••••"
        title="Confirm new password"
        autocomplete="new-password"
      />
    </div>
  </div>

  <div class="pwd-actions">
    <button
      class="btn-save"
      type="button"
      (click)="submitPasswordChange()"
      [disabled]="isSavingPassword"
    >
      <span *ngIf="isSavingPassword" class="spinner-sm" aria-hidden="true"></span>
      <span>{{ isSavingPassword ? 'Updating…' : 'Update Password' }}</span>
    </button>
    <button class="btn-cancel" type="button" (click)="toggleChangePassword()">Cancel</button>
  </div>
</div>

<!-- Delete account trigger row -->
<button
  type="button"
  class="security-row security-row--danger"
  (click)="openDeleteConfirm()"
  title="Permanently delete account"
>
  <div class="security-row__left">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <polyline points="3 6 5 6 21 6" />
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
    </svg>
    <span class="security-row__label">Delete Account</span>
  </div>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="15"
    height="15"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    class="security-chevron"
    aria-hidden="true"
  >
    <polyline points="9 18 15 12 9 6" />
  </svg>
</button>
