<div class="page notifications-page" [attr.aria-busy]="loading || clearingAll">
  <!-- ════════════════════════════════════════════
       A. COMPACT HERO HEADER
       ════════════════════════════════════════════ -->
  <app-notification-header
    [readRate]="getReadRate()"
    [activeFiltersCount]="getActiveFiltersCount()"
    [unreadCount]="unreadCount"
    [markingAllRead]="markingAllRead"
    [loading]="loading"
    [total]="total"
    [deletingSelected]="deletingSelected"
    [clearingAll]="clearingAll"
    (clearRequested)="showClearAllDialog = true"
    (refreshRequested)="fetchNotifications(1, true)"
    (markAllRequested)="markAllAsRead()"
  ></app-notification-header>
  <!-- ════════════════════════════════════════════
       B. STREAMLINED COMPACT FILTERS PANEL
       ════════════════════════════════════════════ -->
  <app-notification-filters
    [unreadOnly]="unreadOnly"
    [selectedTeamId]="selectedTeamId"
    [teams]="teams"
    [organizations]="organizations"
    [selectedOrganizationId]="selectedOrganizationId"
    [typeOptions]="typeOptions"
    [typeFilter]="typeFilter"
    [to]="to"
    [from]="from"
    [search]="search"
    [clearingAll]="clearingAll"
    (applyRequested)="applyFilters()"
    (resetRequested)="resetFilters()"
    (organizationChanged)="onOrganizationChange()"
    (teamChanged)="onTeamChange()"
    (quickFilterRequested)="setQuickFilter($event)"
    (searchChange)="search = $event"
    (fromChange)="from = $event"
    (toChange)="to = $event"
    (typeFilterChange)="typeFilter = $event"
    (selectedOrganizationIdChange)="selectedOrganizationId = $event"
    (selectedTeamIdChange)="selectedTeamId = $event"
    (unreadOnlyChange)="unreadOnly = $event"
  ></app-notification-filters>
  <!-- ── Operational Status Banner ───────────────────────── -->
  <div class="status" role="status" aria-live="polite" *ngIf="statusMessage">
    <svg
      class="status-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>
    <span>{{ statusMessage }}</span>
  </div>

  <!-- ════════════════════════════════════════════
       C. INBOX FEED CONTAINER
       ════════════════════════════════════════════ -->
  <app-notification-feed
    [loadFailed]="loadFailed"
    [notifications]="notifications"
    [totalPages]="totalPages"
    [page]="page"
    [total]="total"
    [unreadCount]="unreadCount"
    [deletingSelected]="deletingSelected"
    [selectedIds]="selectedIds"
    [loading]="loading"
    [clearingAll]="clearingAll"
    (deleteSelectedRequested)="showBulkDeleteDialog = true"
    (selectionCleared)="clearSelection()"
    (pageRequested)="fetchNotifications($event)"
    (retryRequested)="fetchNotifications(page, true)"
    (openRequested)="openNotification($event)"
    (markReadRequested)="markAsRead($event)"
    (deleteRequested)="askDelete($event)"
    (selectionToggled)="toggleSelection($event)"
  ></app-notification-feed>
</div>

<!-- ════════════════════════════════════════════
     CONFIRMATION DIALOGS
     ════════════════════════════════════════════ -->
<app-notification-confirm-dialog
  [open]="showDeleteDialog"
  title="Delete this notification?"
  message="This action cannot be undone."
  confirmText="Delete"
  cancelText="Cancel"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
></app-notification-confirm-dialog>

<app-notification-confirm-dialog
  [open]="showBulkDeleteDialog"
  title="Delete selected notifications?"
  message="Only selected notifications in your inbox will be deleted. This action cannot be undone."
  confirmText="Delete selected"
  cancelText="Cancel"
  (confirmed)="deleteSelected()"
  (cancelled)="showBulkDeleteDialog = false"
></app-notification-confirm-dialog>

<app-notification-confirm-dialog
  [open]="showClearAllDialog"
  title="Clear all notifications?"
  message="Delete notifications across your entire inbox, including security notices. Filters do not limit this action. Up to 100 records per batch and 500 per confirmation; new activity is preserved. Audit history and receipts remain."
  confirmText="Clear All"
  cancelText="Cancel"
  (confirmed)="clearAll()"
  (cancelled)="showClearAllDialog = false"
></app-notification-confirm-dialog>
