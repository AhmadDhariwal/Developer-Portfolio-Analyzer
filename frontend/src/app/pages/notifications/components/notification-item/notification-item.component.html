<article
  class="notification-item"
  [class.unread]="!notification.isRead"
  [class.notification-item--warning]="getNotificationTone(notification) === 'warning'"
  [class.notification-item--success]="getNotificationTone(notification) === 'success'"
  [class.notification-item--info]="getNotificationTone(notification) === 'info'"
  [class.notification-item--purple]="getNotificationTone(notification) === 'purple'"
>
  <!-- Category Icon Box -->
  <div
    class="notification-icon"
    [class.notification-icon--warning]="getNotificationTone(notification) === 'warning'"
    [class.notification-icon--success]="getNotificationTone(notification) === 'success'"
    [class.notification-icon--info]="getNotificationTone(notification) === 'info'"
    [class.notification-icon--purple]="getNotificationTone(notification) === 'purple'"
  >
    <svg
      *ngIf="getNotificationIcon(notification) === 'user'"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="M20 21a8 8 0 0 0-16 0"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    <svg
      *ngIf="getNotificationIcon(notification) === 'file'"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
    </svg>
    <svg
      *ngIf="getNotificationIcon(notification) === 'github'"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path
        d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
      ></path>
    </svg>
    <svg
      *ngIf="getNotificationIcon(notification) === 'alert'"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path
        d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
      ></path>
      <line x1="12" y1="9" x2="12" y2="13"></line>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </svg>
    <svg
      *ngIf="getNotificationIcon(notification) === 'spark'"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="m12 3-1.9 5.1L5 10l5.1 1.9L12 17l1.9-5.1L19 10l-5.1-1.9L12 3z"></path>
    </svg>
    <svg
      *ngIf="getNotificationIcon(notification) === 'bell'"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="M10.268 21a2 2 0 0 0 3.464 0"></path>
      <path
        d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .738-1.674C19.41 13.956 18 12.499 18 8a6 6 0 1 0-12 0c0 4.499-1.411 5.956-2.738 7.326"
      ></path>
    </svg>
  </div>

  <!-- Notification Main Text Body (click opens notification target) -->
  <div
    class="notification-main"
    (click)="openRequested.emit(notification)"
    (keydown.enter)="openRequested.emit(notification)"
    role="button"
    tabindex="0"
    [attr.aria-label]="'Open ' + notification.title"
  >
    <div class="notification-topline">
      <div class="notification-title-wrap">
        <span
          class="unread-dot"
          *ngIf="!notification.isRead"
          aria-label="Unread notification"
          title="Unread"
        ></span>
        <span class="notification-title">{{ notification.title }}</span>
        <span
          class="type-pill"
          [class.type-pill--warning]="getNotificationTone(notification) === 'warning'"
          [class.type-pill--success]="getNotificationTone(notification) === 'success'"
          [class.type-pill--info]="getNotificationTone(notification) === 'info'"
          [class.type-pill--purple]="getNotificationTone(notification) === 'purple'"
        >
          {{ getNotificationTypeLabel(notification) }}
        </span>
      </div>
    </div>

    <div class="notification-message">{{ notification.message }}</div>

    <div class="notification-meta">
      <span class="meta-time">
        <svg
          class="meta-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        {{ getRelativeTime(notification.createdAt) }}
      </span>
      <span class="meta-separator">•</span>
      <span class="meta-date">{{ formatTime(notification.createdAt) }}</span>
      <span class="pill" [class.unread-pill]="!notification.isRead">
        {{ notification.isRead ? 'Read' : 'Unread' }}
      </span>
    </div>
  </div>

  <!-- Right Side Quick Actions -->
  <div class="notification-actions">
    <label class="select-control">
      <input
        type="checkbox"
        [checked]="selected"
        [attr.aria-label]="'Select ' + notification.title"
        (change)="selectionToggled.emit(notification)"
      />
      <span>Select</span>
    </label>
    <button
      class="ghost-action ghost-action--sm"
      type="button"
      (click)="openRequested.emit(notification)"
    >
      Open
    </button>
    <button
      class="ghost-action ghost-action--sm"
      type="button"
      *ngIf="!notification.isRead"
      (click)="markReadRequested.emit(notification)"
    >
      Mark Read
    </button>
    <button
      class="ghost-action ghost-action--sm ghost-action--danger"
      type="button"
      (click)="deleteRequested.emit(notification)"
    >
      Delete
    </button>
  </div>
</article>
