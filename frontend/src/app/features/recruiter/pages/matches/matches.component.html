<section class="hub-page">
  <header class="page-header">
    <div class="page-header__copy">
      <span class="page-header__eyebrow">Recruiter Hub · Weighted Scoring</span>
      <h1>Matches</h1>
      <p>
        Generate transparent, weighted JD-to-developer evaluations and move top talent to shortlists.
      </p>
    </div>

    <div class="page-header__actions">
      <span class="count-pill">{{ matches.length }} results loaded</span>
      <button
        type="button"
        class="btn-secondary"
        *ngIf="compareIds.size > 0"
        [disabled]="compareIds.size < 2"
        (click)="openComparison()"
      >
        Compare Selected ({{ compareIds.size }}/3)
      </button>
      <button
        type="button"
        class="btn-primary"
        [disabled]="generating || !selectedJobId"
        (click)="runMatches()"
      >
        {{ generating ? 'Generating...' : 'Generate Matches' }}
      </button>
    </div>
  </header>

  <app-ui-error-state
    *ngIf="error && !matches.length && !jobs.length && !matchesLoading"
    title="Unable to load matching workspace"
    [message]="error"
    (retry)="loadJobs(); loadMatches()"
  />

  <div class="banner banner--error" *ngIf="error && (matches.length || jobs.length || matchesLoading)">
    {{ error }}
  </div>
  <div class="banner banner--success" *ngIf="notice">{{ notice }}</div>

  <div class="metric-grid">
    <app-recruiter-stat-card
      label="Open Jobs"
      [value]="openJobsCount"
      tone="indigo"
      hint="Active requisitions available"
    />
    <app-recruiter-stat-card
      label="Generated"
      [value]="generatedCount"
      tone="blue"
      hint="Active ranked evaluations"
    />
    <app-recruiter-stat-card
      label="Shortlisted"
      [value]="shortlistedCount"
      tone="green"
      hint="Promoted to pipeline"
    />
    <app-recruiter-stat-card
      label="Rejected"
      [value]="rejectedCount"
      tone="orange"
      hint="Excluded for selected job"
    />
  </div>

  <section class="surface-card controls-panel">
    <div class="controls-grid">
      <div class="control-block">
        <label for="match-target-job">Target Job Requisition</label>
        <app-searchable-select
          inputId="match-target-job"
          [options]="jobOptions"
          [value]="selectedJobId"
          placeholder="Select a recruiter job"
          (valueChange)="onJobChange($event)"
        />
      </div>

      <div class="control-block control-block--focus">
        <div class="focus-head">
          <div>
            <label for="match-candidate-search">
              Optional Candidate Subset ({{ selectedCandidateIds.size }} selected)
            </label>
            <small>Leave empty to score every visible candidate in the pool.</small>
          </div>
          <button
            type="button"
            class="btn-secondary btn-sm"
            *ngIf="selectedCandidateIds.size > 0"
            (click)="clearSelection()"
          >
            Clear Focus
          </button>
        </div>

        <input
          id="match-candidate-search"
          type="search"
          [(ngModel)]="candidateSearch"
          placeholder="Search pool candidates by name, stack, or skill..."
        />

        <div class="candidate-chips" *ngIf="filteredPoolCandidates.length">
          <button
            type="button"
            class="candidate-chip"
            *ngFor="let candidate of filteredPoolCandidates; trackBy: trackByItem"
            [class.is-selected]="isCandidateSelected(candidate)"
            (click)="toggleCandidate(candidate)"
          >
            <span>{{ candidate.name || candidate.fullName || 'Candidate' }}</span>
            <small>{{ candidate.readinessScore ?? candidate.score ?? 0 }}%</small>
          </button>
        </div>
      </div>
    </div>
  </section>

  <div class="charts-grid" *ngIf="!matchesLoading && matches.length > 0">
    <app-recruiter-performance-chart
      title="Match Score Distribution"
      subtitle="Loaded matches grouped by composite match percentage"
      mode="column"
      tone="indigo"
      [height]="210"
      [items]="scoreDistributionItems"
    />
    <app-recruiter-performance-chart
      title="Match Workflow Breakdown"
      subtitle="Current disposition of generated match evaluations"
      mode="donut"
      tone="green"
      [height]="210"
      [items]="statusDistributionItems"
    />
  </div>

  <div class="compare-tray" *ngIf="compareIds.size > 0">
    <div class="compare-tray__items">
      <span class="compare-tray__label">Compare queue:</span>
      <span class="compare-pill" *ngFor="let item of selectedCompareList">
        <span>{{ item.name }}</span>
        <button
          type="button"
          [attr.aria-label]="'Remove ' + item.name + ' from comparison'"
          (click)="removeCompareId(item.id)"
        >
          ×
        </button>
      </span>
    </div>
    <div class="compare-tray__actions">
      <button type="button" class="btn-secondary btn-sm" (click)="clearCompare()">Clear</button>
      <button
        type="button"
        class="btn-primary btn-sm"
        [disabled]="compareIds.size < 2"
        (click)="openComparison()"
      >
        Compare ({{ compareIds.size }}/3)
      </button>
    </div>
  </div>

  <div class="toolbar">
    <div class="segmented-tabs" role="tablist" aria-label="Filter matches by status">
      <button
        type="button"
        role="tab"
        [class.is-active]="statusFilter === 'all'"
        [attr.aria-selected]="statusFilter === 'all'"
        (click)="setStatusFilter('all')"
      >
        All ({{ matches.length }})
      </button>
      <button
        type="button"
        role="tab"
        [class.is-active]="statusFilter === 'generated'"
        [attr.aria-selected]="statusFilter === 'generated'"
        (click)="setStatusFilter('generated')"
      >
        Generated ({{ generatedCount }})
      </button>
      <button
        type="button"
        role="tab"
        [class.is-active]="statusFilter === 'shortlisted'"
        [attr.aria-selected]="statusFilter === 'shortlisted'"
        (click)="setStatusFilter('shortlisted')"
      >
        Shortlisted ({{ shortlistedCount }})
      </button>
      <button
        type="button"
        role="tab"
        [class.is-active]="statusFilter === 'rejected'"
        [attr.aria-selected]="statusFilter === 'rejected'"
        (click)="setStatusFilter('rejected')"
      >
        Rejected ({{ rejectedCount }})
      </button>
    </div>
  </div>

  <app-recruiter-loader
    *ngIf="matchesLoading || jobsLoading || candidatesLoading"
    label="Loading ranked matches..."
    variant="cards"
    [count]="4"
  />

  <div class="card-grid" *ngIf="!matchesLoading && filteredMatches.length > 0">
    <app-match-card
      *ngFor="let match of filteredMatches; trackBy: trackByItem"
      [match]="match"
      [selected]="isMatchSelected(match)"
      (shortlist)="shortlist($event)"
      (compare)="compare($event)"
      (reject)="updateStatus($event, 'rejected')"
      (reset)="updateStatus($event, 'generated')"
    />
  </div>

  <app-recruiter-empty-state
    *ngIf="!matchesLoading && filteredMatches.length === 0 && !error"
    [title]="matches.length ? 'No matches in this filter' : 'No generated matches yet'"
    [message]="
      matches.length
        ? 'Switch status tabs to inspect other ranked results for this requisition.'
        : 'Select a target job requisition above and click Generate Matches to score visible developers.'
    "
  />
</section>
