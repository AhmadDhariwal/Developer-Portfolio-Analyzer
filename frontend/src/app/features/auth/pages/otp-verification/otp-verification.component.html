<app-auth-shell mode="centered" backLink="/auth/login" backLabel="Back to login">
  <app-ui-card class="auth-card" [noHeader]="true" [hoverEffect]="false">
    <div class="auth-step-header">
      <div class="auth-step-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
          />
        </svg>
      </div>
      <span class="auth-step-badge auth-step-badge--primary">02 / Verify Code</span>
    </div>

    <div class="auth-card-header">
      <h1>Verify your code</h1>
      <p>
        Enter the 6-digit verification code sent to
        <strong class="otp-destination">{{ destinationLabel }}</strong
        >.
      </p>
      @if (expiryDisplay) {
        <span class="expiry-pill" [class.is-expired]="expiryDisplay === 'Code expired'">
          {{ expiryDisplay }}
        </span>
      }
    </div>

    <form (ngSubmit)="submit()" class="auth-form" novalidate>
      @if (error) {
        <div class="auth-alert auth-alert--error" role="alert">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <path stroke-linecap="round" d="M12 8v4M12 16h.01" />
          </svg>
          <span>{{ error }}</span>
        </div>
      }

      @if (info) {
        <div class="auth-alert auth-alert--success" role="status">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4" />
          </svg>
          <span>{{ info }}</span>
        </div>
      }

      <div class="otp-input-wrap">
        <app-otp-input (otpChange)="onOtpChange($event)"></app-otp-input>
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="isLoading || isResending || otp.length !== 6"
      >
        @if (isLoading) {
          <span class="btn-spinner" aria-hidden="true"></span>
          <span>Verifying...</span>
        } @else {
          <span>Verify code</span>
        }
      </button>

      <div class="resend-row">
        <button
          type="button"
          class="secondary-btn"
          [disabled]="resendSeconds > 0 || isResending || isLoading"
          (click)="resendOtp()"
        >
          @if (isResending) {
            <span class="btn-spinner" aria-hidden="true"></span>
            <span>Resending code...</span>
          } @else if (resendSeconds > 0) {
            <span>Resend code in {{ resendSeconds }}s</span>
          } @else {
            <span>Resend verification code</span>
          }
        </button>
      </div>
    </form>

    <div class="auth-card-footer">
      <a routerLink="/auth/login" class="auth-link">Return to sign in</a>
    </div>
  </app-ui-card>
</app-auth-shell>
