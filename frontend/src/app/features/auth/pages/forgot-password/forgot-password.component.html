<div class="auth-themed" [ngClass]="'theme--' + selectedTheme">
  <div class="auth-page">
    <!-- Back Button (Top Left) -->
    <a routerLink="/auth/login" class="home-link">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="home-icon"
      >
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      Back
    </a>

    <div class="auth-container">
      <!-- Brand Section -->
      <div class="auth-brand">
        <h1 class="logo">DevInsight<span>AI</span></h1>
        <p class="tagline">INTELLIGENCE IN MOTION.</p>
      </div>

      <!-- Auth Card -->
      <app-ui-card class="auth-card" (keydown.enter)="submit()">
        <div class="auth-header">
          <h2>Forgot Password</h2>
          <p>Choose where to receive your one-time verification code</p>
        </div>

        <div *ngIf="error" class="error-message" role="alert">
          <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"
            />
          </svg>
          {{ error }}
        </div>

        <div class="type-segmentation" role="radiogroup" aria-label="OTP Delivery Method">
          <label [class.active]="type === 'email'">
            <input type="radio" name="type" value="email" [(ngModel)]="type" class="hidden-radio" />
            <svg
              class="type-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            Email Address
          </label>
          <label [class.active]="type === 'phone'">
            <input type="radio" name="type" value="phone" [(ngModel)]="type" class="hidden-radio" />
            <svg
              class="type-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
              <line x1="12" y1="18" x2="12.01" y2="18" />
            </svg>
            Phone Number
          </label>
        </div>

        <div *ngIf="type === 'email'" class="form-group slide-in">
          <label for="forgot-email">Email Address</label>
          <div class="input-wrapper">
            <input
              id="forgot-email"
              [(ngModel)]="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
        </div>

        <div *ngIf="type === 'phone'" class="form-group slide-in">
          <label>Country Code</label>
          <app-country-code-dropdown [(value)]="countryCode"></app-country-code-dropdown>
        </div>

        <div *ngIf="type === 'phone'" class="form-group slide-in">
          <label for="forgot-phone">Phone Number</label>
          <div class="input-wrapper">
            <input
              id="forgot-phone"
              [(ngModel)]="phoneNumber"
              name="phoneNumber"
              type="text"
              placeholder="300 123 4567"
              autocomplete="tel-national"
            />
          </div>
        </div>

        <app-ui-button
          variant="primary"
          [fullWidth]="true"
          [loading]="isLoading"
          (click)="submit()"
        >
          Send Verification Code
        </app-ui-button>

        <div class="auth-footer-bottom">
          <p>Remember your password? <a routerLink="/auth/login">Back to Sign In</a></p>
        </div>
      </app-ui-card>
    </div>
  </div>
</div>
