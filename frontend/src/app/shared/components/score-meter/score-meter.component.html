<div [class]="'score-meter size-' + size">
  <svg viewBox="0 0 200 200" class="score-svg" aria-hidden="true">
    <defs>
      <linearGradient [attr.id]="gradientId" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" [attr.stop-color]="scoreColor" />
        <stop offset="100%" [attr.stop-color]="gradientEndColor" />
      </linearGradient>
    </defs>

    <!-- Track -->
    <circle [attr.cx]="cx" [attr.cy]="cy" [attr.r]="radius" class="track"></circle>

    <!-- Progress arc -->
    <circle
      [attr.cx]="cx"
      [attr.cy]="cy"
      [attr.r]="radius"
      class="progress-arc"
      [attr.stroke]="'url(#' + gradientId + ')'"
      [style.strokeDasharray]="circumference"
      [style.strokeDashoffset]="dashOffset"
      [style.filter]="'drop-shadow(0 2px 8px ' + glowColor + ')'"
    ></circle>
  </svg>

  <!-- Center label -->
  <div class="score-label">
    <span class="score-value" [style.color]="scoreColor">{{ score }}</span>
    <span class="score-out">/ {{ maxScore }}</span>
  </div>
</div>
