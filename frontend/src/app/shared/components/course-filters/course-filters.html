<form class="filter-toolbar" (ngSubmit)="applyFilters()">
  <label class="search-field"
    >Search topic or skill
    <div class="search-control">
      <input
        name="topic"
        aria-label="Search topic or skill"
        type="search"
        [(ngModel)]="filters.topic"
        (ngModelChange)="onFilterChange()"
        placeholder="e.g. Angular or SQL"
        maxlength="60"
      /><button
        type="button"
        *ngIf="filters.topic"
        aria-label="Clear search"
        (click)="clearTopic()"
      >
        Clear
      </button>
    </div></label
  >
  <label
    >Platform<select
      name="platform"
      aria-label="Platform"
      [(ngModel)]="filters.platform"
      (ngModelChange)="onFilterChange()"
    >
      <option *ngFor="let option of platformOptions" [value]="option.value">
        {{ option.label }}
      </option>
    </select></label
  >
  <label
    >Level<select
      name="level"
      aria-label="Level"
      [(ngModel)]="filters.level"
      (ngModelChange)="onFilterChange()"
    >
      <option *ngFor="let option of levelOptions" [value]="option.value">{{ option.label }}</option>
    </select></label
  >
  <label
    >Duration<select
      name="duration"
      aria-label="Duration"
      [(ngModel)]="filters.duration"
      (ngModelChange)="onFilterChange()"
    >
      <option *ngFor="let option of durationOptions" [value]="option.value">
        {{ option.label }}
      </option>
    </select></label
  >
  <label
    >Provider review rating<select
      name="rating"
      aria-label="Provider review rating"
      [(ngModel)]="filters.rating"
      (ngModelChange)="onFilterChange()"
    >
      <option *ngFor="let option of ratingOptions" [value]="option.value">
        {{ option.label }}
      </option>
    </select></label
  >
  <div class="filter-actions">
    <button class="primary" type="submit" [disabled]="isApplying">
      {{ isApplying ? 'Applying…' : 'Apply Filters' }}</button
    ><button
      type="button"
      [disabled]="isApplying || (!hasDraftFilters && !hasActiveFilters)"
      (click)="resetFilters()"
    >
      Reset
    </button>
  </div>
  <p class="filter-note">
    {{
      hasPendingChanges
        ? 'Unapplied changes. Apply Filters to update results.'
        : 'Filters apply together.'
    }}
    Ratings filter only courses with genuine provider reviews; unknown values remain unknown.
  </p>
</form>
