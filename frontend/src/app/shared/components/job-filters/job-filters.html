<section class="filters-panel" aria-labelledby="job-filter-heading">
  <div class="filter-heading">
    <div class="heading-meta">
      <span class="heading-icon" aria-hidden="true">✦</span>
      <h2 id="job-filter-heading">Filter Opportunities</h2>
      <span
        class="active-count-badge"
        [class.visible]="hasActiveFilters || hasDraftFilters"
        [attr.aria-hidden]="!(hasActiveFilters || hasDraftFilters)"
      >
        {{ activeCount }} active
      </span>
    </div>
    <div class="filter-heading-actions">
      <button
        type="button"
        class="btn-reset"
        (click)="resetFilters()"
        [disabled]="isApplying || (!hasActiveFilters && !hasDraftFilters)"
      >
        Reset
      </button>
      <button
        type="button"
        class="btn-apply-filters"
        [disabled]="isApplying"
        (click)="apply.emit()"
      >
        Apply filters
      </button>
    </div>
  </div>

  <div class="filter-controls-row">
    <div class="filter-group">
      <label for="job-source">Source</label>
      <select id="job-source" [(ngModel)]="filters.platform" (ngModelChange)="onFilterChange()">
        @for (option of platformOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="filter-group">
      <label for="job-location">Location</label>
      <select id="job-location" [(ngModel)]="filters.location" (ngModelChange)="onFilterChange()">
        @for (option of locationOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="filter-group">
      <label for="job-experience">Experience</label>
      <select
        id="job-experience"
        [(ngModel)]="filters.experienceLevel"
        (ngModelChange)="onFilterChange()"
      >
        @for (option of experienceOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="filter-group">
      <label for="job-type">Employment</label>
      <select id="job-type" [(ngModel)]="filters.jobType" (ngModelChange)="onFilterChange()">
        @for (option of jobTypeOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="filter-group skill-group">
      <label for="job-skill-input">Skill</label>
      <div class="skill-input-wrap">
        <input
          id="job-skill-input"
          type="text"
          [(ngModel)]="filters.skills"
          (ngModelChange)="onFilterChange()"
          (keydown.enter)="apply.emit()"
          placeholder="e.g. React, Python"
          class="skill-input"
        />
        @if (filters.skills) {
          <button
            type="button"
            class="btn-clear-inline-skill"
            (click)="clearSkill()"
            aria-label="Clear skill filter"
          >
            ×
          </button>
        }
      </div>
    </div>
  </div>

  <div class="quick-skills-strip">
    <span class="quick-skills-label">Quick filter:</span>
    <div class="quick-skills-scroll">
      @for (skill of skillOptions; track skill) {
        <button
          type="button"
          class="skill-chip"
          [class.selected]="filters.skills.toLowerCase() === skill.toLowerCase()"
          [attr.aria-pressed]="filters.skills.toLowerCase() === skill.toLowerCase()"
          (click)="selectSkill(skill)"
        >
          {{ skill }}
        </button>
      }
    </div>
  </div>
</section>
