<div
  class="theme-menu"
  [class.is-open]="isOpen()"
  [class.is-full-width]="fullWidth"
  [class.is-inline-menu]="inlineMenu"
  [class.has-compact-mobile-label]="compactMobileLabel"
>
  <button
    #triggerButton
    type="button"
    class="theme-menu-trigger"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="'Color theme: ' + currentOption.label"
    (click)="toggleMenu()"
  >
    <span class="theme-trigger-icon" aria-hidden="true">
      @if (selectedTheme === 'light') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4" />
          <path
            stroke-linecap="round"
            d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"
          />
        </svg>
      } @else if (selectedTheme === 'dark') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"
          />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="12" rx="2" />
          <path stroke-linecap="round" d="M8 20h8M12 16v4" />
        </svg>
      }
    </span>

    <span class="theme-trigger-label">{{ currentOption.label }}</span>

    <svg
      class="theme-trigger-chevron"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
    </svg>
  </button>

  @if (isOpen()) {
    <div class="theme-menu-popover" role="menu" aria-label="Theme options">
      <div class="theme-menu-header">Appearance</div>
      @for (item of themes; track item.id) {
        <button
          type="button"
          class="theme-menu-item"
          role="menuitemradio"
          [class.is-active]="selectedTheme === item.id"
          [attr.aria-checked]="selectedTheme === item.id"
          [attr.aria-label]="'Switch to ' + item.label + ' theme'"
          (click)="selectTheme(item.id)"
        >
          <span class="theme-item-icon" aria-hidden="true">
            @if (item.id === 'light') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4" />
                <path
                  stroke-linecap="round"
                  d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"
                />
              </svg>
            } @else if (item.id === 'dark') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"
                />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="12" rx="2" />
                <path stroke-linecap="round" d="M8 20h8M12 16v4" />
              </svg>
            }
          </span>

          <span class="theme-item-copy">
            <span class="theme-item-title">{{ item.label }}</span>
            <span class="theme-item-desc">{{ item.description }}</span>
          </span>

          @if (selectedTheme === item.id) {
            <svg
              class="theme-item-check"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          }
        </button>
      }
    </div>
  }
</div>
